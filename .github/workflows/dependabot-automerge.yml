name: Merge Dependabot updates

on:
  workflow_run:
    workflows: [CI, Dependabot integration]
    types: [completed]

permissions: {}

concurrency:
  group: dependabot-automerge
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      ((github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'success') ||
       github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      # workflow_run uses the default branch. Never check out the PR or install
      # its dependencies in this job, which holds a token that can merge PRs.
      - name: Check out trusted automation
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Merge verified updates or test integration with current main
        run: ruby scripts/merge-dependabot.rb
        env:
          GH_TOKEN: ${{ github.token }}
