name: CI

on:
  push:
    branches:
      - main
      - demo
  pull_request:
  workflow_call:
    inputs:
      checkout_ref:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.checkout_ref || github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: Web, shared contracts and functions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Audit web dependencies
        run: npm audit --audit-level=moderate
        working-directory: web

      - name: Check web application
        run: npm run check
        working-directory: web

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Test web user flows
        run: npm run test:e2e
        working-directory: web

      - name: Test offline web demo
        run: npm run test:demo -- --workers=2
        working-directory: web

      - name: Validate Appwrite manifests
        run: ruby scripts/prepare-appwrite-config.rb --check .env.example

      - name: Test Appwrite endpoint validation
        run: ruby scripts/secure_appwrite_endpoint.test.rb

      - name: Test dependency automation
        run: ruby scripts/merge-dependabot.test.rb

      - name: Set up Python lint tools
        run: |
          python3 -m venv /tmp/fyre-python-checks
          /tmp/fyre-python-checks/bin/python -m pip install -r requirements-lint.txt

      - name: Check Python style
        run: |
          /tmp/fyre-python-checks/bin/ruff check scripts
          /tmp/fyre-python-checks/bin/ruff format --check scripts

      - name: Test upload maintenance tools
        run: python3 -m unittest discover -s scripts -p "*_test.py"

      - name: Test shared contracts
        run: node --test shared/contracts/index.test.mjs

      - name: Test Appwrite functions
        run: npm --prefix functions test

  android:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android/Fyre
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run unit tests, lint and release build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease assembleDemo

      - name: Test offline Android demo
        run: ./gradlew --no-daemon -PfyreUiDemo=true testDemoUnitTest

  ios:
    name: iOS
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run iOS unit and UI tests
        shell: bash
        run: |
          set -euo pipefail
          simulator_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          if [[ -z "$simulator_id" ]]; then
            echo "No available iPhone simulator was found." >&2
            exit 1
          fi

          xcodebuild test \
            -project ios/Fyre/Fyre.xcodeproj \
            -scheme Fyre \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -parallel-testing-enabled NO \
            -resultBundlePath /tmp/Fyre-tests.xcresult

      - name: Test isolated iOS offline demo
        shell: bash
        run: |
          set -euo pipefail
          simulator_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          test -n "$simulator_id"
          xcodebuild test \
            -project ios/Fyre/Fyre.xcodeproj \
            -scheme FyreDemo \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -parallel-testing-enabled NO \
            -resultBundlePath /tmp/Fyre-demo-tests.xcresult \
            -derivedDataPath /tmp/Fyre-demo \
            CODE_SIGNING_ALLOWED=NO
          test ! -f /tmp/Fyre-demo/Build/Products/Demo-iphonesimulator/Fyre.app/Config.plist
