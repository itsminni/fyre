name: iOS CI

on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ci.yml'
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ci.yml'

jobs:
  test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios/Fyre
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Fyre.xcodeproj -scheme Fyre

      - name: Test (iPhone 16 simulator)
        run: xcodebuild test -project Fyre.xcodeproj -scheme Fyre -destination 'platform=iOS Simulator,name=iPhone 16' -test-timeouts-enabled YES

  distribution-readiness:
    runs-on: macos-15
    needs: test
    defaults:
      run:
        working-directory: ios/Fyre
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate signing setup file exists
        run: |
          test -f docs/ios-signing.md
          echo "Signing guide present"
